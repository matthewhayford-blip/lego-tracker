name: debug-fetch

# One-off diagnostic: fetches real pages from lego.com and bricktracker.co.uk
# and commits the raw HTML + a JSON-LD summary into data/debug/, so they can
# be inspected from anywhere via raw.githubusercontent.com. Manual trigger
# only -- this is not part of the normal collection pipeline.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python collector/debug_fetch.py
      - name: Commit debug capture
        run: |
          git config user.name  "brick-exit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/debug/
          git diff --staged --quiet || git commit -m "debug: capture real source HTML for parser diagnosis"
          git push
