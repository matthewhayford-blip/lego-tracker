name: ci
on:
  pull_request:
  push: { branches: [main] }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Build must succeed
        run: python site/build.py
      - name: Internal links must resolve
        run: python tools/linkcheck.py public

  # Hits the real sources against a handful of sets. Allowed to fail without
  # blocking a merge -- its job is to tell us a source broke, not to gate code.
  smoke-sources:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m collector.run --limit 5
